<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        .glass-panel {
            background-color: rgba(26, 35, 39, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(61, 73, 75, 0.3);
        }
        .interactive-glow:hover, .interactive-glow:focus {
            border-color: #60d7e6;
            box-shadow: 0 0 8px rgba(96, 215, 230, 0.2);
        }
        .form-input {
            background-color: #12181B;
            border: 1px solid #242E33;
            color: #dee3e7;
            transition: all 0.2s ease-in-out;
        }
        .form-input:focus {
            border-color: #60d7e6;
            box-shadow: 0 0 0 1px #60d7e6, 0 0 8px rgba(96, 215, 230, 0.1);
            outline: none;
        }
        
        /* Shimmer effect for card preview */
        .card-shimmer {
            position: relative;
            overflow: hidden;
        }
        .card-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }
    </style>
</head>
<body class="bg-background text-on-background flex h-screen overflow-hidden selection:bg-primary selection:text-on-primary">
<!-- TopAppBar (Hidden on desktop in this specific workspace layout per requirements, but included for completeness if mobile) -->
<!-- Suppressing top app bar for this focused workspace view to maximize canvas area -->
<!-- Left Sidebar (Configuration & Navigation) -->
<aside class="fixed left-0 top-0 h-screen w-sidebar-width bg-surface-container dark:bg-surface-container border-r border-outline-variant flex flex-col z-30 shadow-none">
<!-- Header -->
<div class="p-6 border-b border-outline-variant/30 flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" data-icon="credit_card">credit_card</span>
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary leading-tight">BlazeCard</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-[11px] uppercase tracking-wider mt-0.5">Fintech Card Previewer</p>
</div>
</div>
<!-- Navigation Tabs (Shared Component Nav) -->
<nav class="px-4 py-6 space-y-2 flex-grow overflow-y-auto">
<p class="font-label-caps text-label-caps text-on-surface-variant/60 mb-3 px-2">Workspace</p>
<!-- Active Tab: Form -->
<button class="w-full flex items-center gap-4 bg-secondary-container text-on-secondary-container rounded-lg p-3 transition-transform scale-100 hover:bg-surface-elevated duration-200 text-left">
<span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
<span class="font-body-md text-body-md font-medium flex-grow">Form</span>
<span class="w-1.5 h-1.5 rounded-full bg-primary shadow-[0_0_8px_rgba(96,215,230,0.6)]"></span>
</button>
<!-- Inactive Tab: Code -->
<button class="w-full flex items-center gap-4 text-on-surface-variant hover:text-on-surface p-3 rounded-lg hover:bg-surface-elevated transition-colors duration-200 text-left">
<span class="material-symbols-outlined" data-icon="code">code</span>
<span class="font-body-md text-body-md font-medium">Code</span>
</button>
<!-- Inactive Tab: Visual -->
<button class="w-full flex items-center gap-4 text-on-surface-variant hover:text-on-surface p-3 rounded-lg hover:bg-surface-elevated transition-colors duration-200 text-left">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
<span class="font-body-md text-body-md font-medium">Visual</span>
</button>
<div class="my-6 border-t border-outline-variant/30"></div>
<!-- Form Configuration Area -->
<div class="px-2 space-y-5">
<div class="flex items-center justify-between mb-2">
<p class="font-label-caps text-label-caps text-on-surface-variant/60">Configuration</p>
<span class="material-symbols-outlined text-on-surface-variant/50 text-[16px] cursor-help" data-icon="info">info</span>
</div>
<!-- Input: Card Title -->
<div class="space-y-1.5 group">
<label class="block font-label-caps text-label-caps text-white/60">Card Title</label>
<input class="form-input w-full rounded-lg px-3 py-2 font-body-sm text-body-sm" placeholder="e.g. Platinum Plus" type="text" value="Premium Rewards"/>
</div>
<!-- Input: Member Name -->
<div class="space-y-1.5 group">
<label class="block font-label-caps text-label-caps text-white/60">Member Name</label>
<input class="form-input w-full rounded-lg px-3 py-2 font-body-sm text-body-sm uppercase" placeholder="JOHN DOE" type="text" value="ALEXANDER SMITH"/>
</div>
<!-- Input: Card Number (Masked) -->
<div class="space-y-1.5 group relative">
<label class="block font-label-caps text-label-caps text-white/60">Card Number (Masked)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant/50 text-[18px]" data-icon="pin">pin</span>
</span>
<input class="form-input w-full rounded-lg pl-9 pr-3 py-2 font-body-sm text-body-sm tracking-widest font-mono" placeholder="•••• •••• •••• 0000" type="text" value="•••• •••• •••• 4242"/>
</div>
</div>
<!-- Input: Expiry Date -->
<div class="space-y-1.5 group">
<label class="block font-label-caps text-label-caps text-white/60">Expiry Date</label>
<input class="form-input w-full rounded-lg px-3 py-2 font-body-sm text-body-sm w-24" placeholder="MM/YY" type="text" value="12/28"/>
</div>
</div>
</nav>
<!-- Footer Actions -->
<div class="p-4 border-t border-outline-variant mt-auto space-y-4">
<div class="flex items-center justify-between text-on-surface-variant hover:text-on-surface cursor-pointer px-2 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[18px]" data-icon="settings">settings</span>
<span class="font-body-sm text-body-sm">Settings</span>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-body-md text-body-md font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-all shadow-[0_0_12px_rgba(96,215,230,0.2)] hover:shadow-[0_0_16px_rgba(96,215,230,0.4)]">
<span class="material-symbols-outlined text-[20px]" data-icon="publish">publish</span>
                Build Card
            </button>
</div>
</aside>
<!-- Main Fluid Workspace -->
<main class="ml-sidebar-width flex-grow flex flex-col h-screen bg-[#12181B] relative">
<!-- Hero Banner Background -->
<div class="h-64 w-full relative shrink-0">
<img alt="Abstract technological background with a cute quokka mascot holding glowing credit cards amidst circuit board patterns in a teal and charcoal palette." class="w-full h-full object-cover opacity-80" data-alt="A highly detailed illustration of a cute, realistic quokka wearing a futuristic tech vest, standing in front of a dark teal background with subtle circuit board patterns. The quokka is playfully holding two stylized, glowing digital credit cards that emit a bright cyan flame-like aura. The lighting is dramatic, highlighting the texture of the quokka's fur and the sleek, glowing elements of the cards and vest, conveying a fun yet advanced fintech vibe." src="https://lh3.googleusercontent.com/aida/AP1WRLsm1761RAk4vNRdmcU9GXZb_gRZNbFzE5M5GUNnh5xkZMvww1DpbuwLStVOHfuxFPSKtzlmbko2L4MMsE4QI0kdIsdE5yG3RuvN1lr4uam5R-0tTfU0YYhd5vIchdwQvGRM0MIOTszJeKYOZDDcvkY-qSbocUh6xCjye2KI7O1DEMrbKuDcVMNCsTex-N9X2q4QjDfem_raNY-Hlstxt4wjRmtbTHpORWQQ7rNaYxoqFk2GrKjcWUM9gM8"/>
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#12181B]"></div>
</div>
<!-- Live Preview Content Area -->
<div class="flex-grow p-8 flex flex-col -mt-20 z-10 overflow-y-auto">
<div class="flex justify-between items-end mb-6">
<div>
<h2 class="font-headline-lg text-headline-lg text-hbf-white drop-shadow-md">Live Preview</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Real-time render of your card configuration</p>
</div>
<!-- Zoom Control -->
<div class="glass-panel px-4 py-2 rounded-full flex items-center gap-3">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="zoom_out">zoom_out</span>
</button>
<div class="w-24 h-1 bg-surface-variant rounded-full relative">
<div class="absolute left-0 top-0 h-full w-2/3 bg-primary rounded-full"></div>
<div class="absolute left-2/3 top-1/2 -translate-y-1/2 -ml-1.5 w-3 h-3 bg-white rounded-full shadow-sm"></div>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="zoom_in">zoom_in</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant ml-2 border-l border-outline-variant/30 pl-3">100%</span>
</div>
</div>
<!-- Canvas Container -->
<div class="flex-grow glass-panel rounded-xl border border-outline-variant/40 flex items-center justify-center p-12 relative overflow-hidden bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-charcoal/40 to-transparent">
<!-- Subtle grid background for the canvas -->
<div class="absolute inset-0 opacity-5" style="background-image: radial-gradient(#60d7e6 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- Digital Wallet Card Render -->
<div class="relative w-[420px] h-[264px] rounded-2xl p-6 flex flex-col justify-between shadow-2xl transition-transform hover:scale-[1.02] cursor-pointer card-shimmer group" style="background: linear-gradient(135deg, #1A2327 0%, #12181B 100%); border: 1px solid rgba(96, 215, 230, 0.2);">
<!-- Decorative glowing orb behind card -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-primary/5 rounded-full blur-[64px] pointer-events-none"></div>
<!-- Card Header -->
<div class="flex justify-between items-start z-10">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-hbf-white tracking-wide">
<span class="text-primary mr-1">///</span> Blaze
                        </div>
<span class="material-symbols-outlined text-hbf-white/80" data-icon="contactless">contactless</span>
</div>
<!-- EMV Chip & Name Placeholder -->
<div class="z-10 mt-4">
<div class="w-12 h-10 rounded bg-gradient-to-br from-[#d4af37]/80 to-[#996515]/80 flex items-center justify-center border border-[#d4af37]/30 shadow-inner overflow-hidden relative opacity-90">
<!-- Chip lines -->
<div class="absolute w-full h-[1px] bg-black/20 top-1/3"></div>
<div class="absolute w-full h-[1px] bg-black/20 top-2/3"></div>
<div class="absolute h-full w-[1px] bg-black/20 left-1/2"></div>
<div class="w-8 h-6 border border-black/20 rounded-sm"></div>
</div>
</div>
<!-- Card Body -->
<div class="z-10 mt-auto space-y-4">
<div class="font-mono text-[22px] tracking-[0.2em] text-hbf-white/90 shadow-sm drop-shadow-sm">
                            •••• •••• •••• 4242
                        </div>
<div class="flex justify-between items-end">
<div class="space-y-1">
<div class="font-label-caps text-label-caps text-hbf-white/50 text-[10px]">CARDHOLDER</div>
<div class="font-body-md text-body-md font-medium text-hbf-white uppercase tracking-wider">ALEXANDER SMITH</div>
</div>
<div class="space-y-1 text-right">
<div class="font-label-caps text-label-caps text-hbf-white/50 text-[10px]">VALID THRU</div>
<div class="font-body-md text-body-md font-medium text-hbf-white font-mono">12/28</div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
</body></html>
