services:
  blazecard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "570:570"
    user: "0"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DataProtection__KeysPath: /app/dp-keys
      BlazeCard__PkPass__Enabled: "true"
      BlazeCard__PkPass__UsePreviewCertificates: "true"
    volumes:
      - blazecard-dp-keys:/app/dp-keys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:570/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  blazecard-dp-keys:
